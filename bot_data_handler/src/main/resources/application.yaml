server:
  port: ${BOT_DATA_HANDLER:8084}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate
    show_sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USERNAME:admin}
    password: ${RABBIT_PASSWORD:password}
    queues:
      bot-message-update: ${RABBIT_BOT_MESSAGE_UPDATE_QUEUE}
      bot-answer-message: ${RABBIT_ANSWER_MESSAGE_QUEUE}
      shift-data: ${RABBIT_SHIFT_DATA_QUEUE}