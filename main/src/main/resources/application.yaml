server:
  port: ${MAIN:8086}

spring:
  datasource:
    drive: org.postgresql.Driver
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate
    show_sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USERNAME:admin}
    password: ${RABBIT_PASSWORD:password}
    queues:
      shift_data: ${RABBIT_SHIFT_DATA_QUEUE}