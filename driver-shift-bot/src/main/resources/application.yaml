server:
  port: ${DRIVE_SHIFT_BOT:8085}

bot:
  name: ${TG_BOT_NAME}
  token: ${TG_BOT_TOKEN}

spring:
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USERNAME:admin}
    password: ${RABBIT_PASSWORD:password}
    queues:
      text-message-update: ${RABBIT_TEXT_MESSAGE_UPDATE_QUEUE}
      answer-message: ${RABBIT_ANSWER_MESSAGE_QUEUE}
